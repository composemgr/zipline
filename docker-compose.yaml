# nginx proxy address - http://172.17.0.1:64397

name: zipline
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/diced/zipline:latest
    container_name: zipline-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: zipline-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DATABASE_URL: postgres://${DB_USER_NAME:-zipline}:${DB_USER_PASS:-replace-with-a-random-password}@zipline-db:5432/${DB_CREATE_DATABASE_NAME:-zipline}
      CORE_SECRET: ${APP_SECRET_KEY:-replace-with-a-random-32-byte-hex-string}
      CORE_HOSTNAME: 0.0.0.0
      CORE_PORT: 3000
      CORE_TRUSTED_PROXIES: ${ZIPLINE_TRUSTED_PROXIES:-0.0.0.0/0,::/0}
      CORE_RETURN_RELATIVE_URLS: ${ZIPLINE_RETURN_RELATIVE_URLS:-false}
      CORE_CREATE_USER_IF_NOT_EXISTS: ${ZIPLINE_CREATE_USER:-true}
      CORE_USER_USERNAME: ${APP_ADMIN_USER:-admin}
      CORE_USER_PASSWORD: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      CORE_USER_EMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
    ports:
      - '172.17.0.1:64397:3000'
    volumes:
      - './volumes/data/zipline/uploads:/zipline/uploads:z'
      - './volumes/data/zipline/public:/zipline/public:z'
      - './volumes/data/zipline/themes:/zipline/themes:z'
    depends_on:
      zipline-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - zipline

  zipline-db:
    image: postgres:latest
    container_name: zipline-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: zipline-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: zipline-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-zipline}
      POSTGRES_USER: ${DB_USER_NAME:-zipline}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/zipline:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - zipline

networks:
  zipline:
    name: zipline
    external: false
